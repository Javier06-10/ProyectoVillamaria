# Blueprint de Render: sitio estático de Rancho Villa María.
# En Render: New > Blueprint > elegir este repositorio. Render lee este archivo y crea el servicio.
services:
  - type: web
    name: rancho-villa-maria
    runtime: static
    branch: main
    autoDeployTrigger: commit
    # Instalación limpia y build de Astro (la primera vez tarda unos minutos por las imágenes).
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    previews:
      generation: off
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Los navegadores de Playwright solo hacen falta para las pruebas, no para publicar.
      - key: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD
        value: "1"
      # URL pública del sitio: activa la URL canónica, hreflang y la imagen para compartir.
      # Cámbiala cuando tengas dominio propio (p. ej. https://villamaria.com.do).
      - key: SITE_URL
        value: https://rancho-villa-maria.onrender.com
    routes:
      - type: redirect
        source: /en
        destination: /en/
    headers:
      # Seguridad (equivalente a public/_headers, que Render no lee).
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action https://wa.me; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=()
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      # Caché larga para recursos con hash en el nombre y la fuente.
      - path: /_astro/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /fonts/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
